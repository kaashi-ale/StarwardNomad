name: Extract Starward Nomad ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP_FILE="StarwardNomad_Godot4_v2_Final.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERRO: ZIP não encontrado!"
            ls -la
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f "extracted/StarwardNomad/project.godot" ]; then
            echo "ERRO: project.godot não encontrado dentro do ZIP!"
            find extracted -maxdepth 3 -type f | head -50
            exit 1
          fi

          cp -a extracted/StarwardNomad/. .
          rm -rf extracted
          rm "$ZIP_FILE"

          test -f project.godot
          test -f export_presets.cfg
          test -f .github/workflows/build_android_apk.yml

      - name: Save extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Starward Nomad project from ZIP"
          git push
